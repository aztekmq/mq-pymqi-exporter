[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-pymqi-exporter"
version = "0.1.0"
description = "Threaded IBM MQ Prometheus exporter using Python 3 and pyMQI"
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.20.0",
    "PyYAML>=6.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
