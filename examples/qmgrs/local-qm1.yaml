name: QM1
enabled: true
poll_interval: 15s
timeout: 10s

connection:
  queue_manager: QM1
  channel: DEV.APP.SVRCONN
  conn_name: localhost(1415)
  user: app
  password_env: MQ_QM1_PASSWORD

metrics:
  include_queue_manager: true
  include_queues: true
  include_topics: true
  include_channels: true
  include_accounting: true
  include_statistics: true
  include_activity_trace: true
  include_system_topic_stream: true
  queue_patterns:
    - APP.*
    - SYSTEM.ADMIN.COMMAND.QUEUE
  topic_patterns:
    - SYSTEM.ADMIN.TOPIC
  system_topic_subscription_patterns:
    - $SYS/MQ/INFO/QMGR/{qmgr}/Monitor/#
  system_topic_max_messages_per_poll: 500
  channel_patterns:
    - DEV.*
