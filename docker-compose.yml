version: '3.8'
services:
  qm1:
    image: ibmcom/mq
    container_name: qm1
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
      - MQ_APP_PASSWORD=passw0rd
      - MQ_ENABLE_METRICS=true
      - MQ_ENABLE_ADMIN_WEB=true
    ports:
      - "1415:1414"
      - "9444:9443"
      - "9450:9449"
    volumes:
      - ./data/QM1:/mnt/mqm
    healthcheck:
      test: ["CMD", "mqcli", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

